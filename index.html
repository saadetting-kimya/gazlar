<style>
  :root{
    --bg:#0a0e1a; --panel:#111827; --line:#1f2937;
    --ink:#f1f5f9; --dim:#94a3b8; --faint:#64748b;
    --amber:#fbbf24; --sky:#38bdf8; --pink:#fb7185; --mint:#34d399;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;overflow:hidden}
  #app{display:flex;flex-direction:column;height:100dvh;padding:18px 20px 12px;max-width:1180px;margin:0 auto}

  header{flex:0 0 auto}
  .step{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--amber);margin:0}
  h1{font-size:clamp(20px,3.1vw,36px);line-height:1.15;font-weight:700;margin:6px 0 0;color:#fff}
  .say{font-size:clamp(14px,1.6vw,19px);line-height:1.5;color:#cbd5e1;margin:9px 0 0;max-width:80ch}

  .stage{flex:1 1 auto;min-height:0;display:flex;align-items:center;justify-content:center;margin:12px 0}
  canvas{display:block;width:100%;height:100%;border-radius:16px;background:#070b14;border:1px solid var(--line)}
  .slab{width:100%;max-width:900px}
  table{width:100%;border-collapse:collapse;font-size:clamp(13px,1.6vw,18px)}
  td{padding:11px 10px;border-bottom:1px solid var(--line)}
  td:first-child{color:var(--amber);width:40%}
  td:nth-child(2){color:var(--faint);width:6%;text-align:center}
  td:last-child{color:var(--sky)}
  ul.big{font-size:clamp(14px,1.75vw,20px);line-height:1.6;color:#e2e8f0;padding-left:22px;margin:0}
  ul.big li{margin-bottom:12px}
  ul.big b{color:var(--amber)}

  footer{flex:0 0 auto;border-top:1px solid var(--line);padding-top:10px}
  .note{font-size:clamp(12px,1.25vw,14px);color:var(--mint);margin:0 0 10px;line-height:1.5}
  .note b{color:var(--mint);font-weight:700}
  .bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  button{font-size:13px;padding:9px 14px;border-radius:9px;border:1px solid var(--line);
    background:transparent;color:var(--dim);cursor:pointer;transition:.15s}
  button:hover{border-color:#475569;color:#e2e8f0}
  button:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
  button.on{background:var(--sky);color:#0a0e1a;border-color:var(--sky);font-weight:600}
  button.nav{background:var(--amber);color:#0a0e1a;border-color:var(--amber);font-weight:600;padding:10px 18px}
  button:disabled{opacity:.35;cursor:default}
  .count{font-size:12px;color:var(--faint);margin-left:auto;font-variant-numeric:tabular-nums}
  .hide{display:none!important}
  .ctrl{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--dim);
    border:1px solid var(--line);border-radius:9px;padding:6px 10px}
  .ctrl input[type=range]{width:130px;accent-color:var(--amber)}
  .ctrl .val{color:var(--sky);font-variant-numeric:tabular-nums;min-width:44px;text-align:right}
</style>
</head>

/* ============================ FİZİK MOTORU ============================ */
var BASE_SPEED = 1.55;
var K_P = 50/(44*300);      /* referans: n=44, T=300K, V=1 iken P≈50 (bağıl birim) */
var VOL_MIN_FRAC = 0.16;    /* pistonun sıkışabileceği en küçük hacim oranı */
function rnd(a,b){ return a+Math.random()*(b-a); }
function clamp(v,a,b){ return v<a?a:(v>b?b:v); }
function speedFromT(T){ return BASE_SPEED*Math.sqrt(T/300); }

function spawnParticle(box, speed, mass, color, tag, r){
  r = r || 3.4;
  var x = rnd(box.x+r, box.x+box.w-r), y = rnd(box.y+r, box.y+box.h-r);
  var ang = rnd(0, Math.PI*2);
  return {x:x, y:y, vx:Math.cos(ang)*speed, vy:Math.sin(ang)*speed, r:r, m:mass, color:color, tag:tag};
}

function collidePair(a,b){
  var dx=b.x-a.x, dy=b.y-a.y, dist=Math.sqrt(dx*dx+dy*dy);
  var minD=a.r+b.r;
  if (dist>0 && dist<minD){
    var overlap=(minD-dist)/2, nx=dx/dist, ny=dy/dist;
    a.x-=nx*overlap; a.y-=ny*overlap; b.x+=nx*overlap; b.y+=ny*overlap;
    var dvx=b.vx-a.vx, dvy=b.vy-a.vy;
    var vn=dvx*nx+dvy*ny;
    if (vn<0){
      var imp=(2*vn)/(a.m+b.m);
      a.vx+=imp*b.m*nx; a.vy+=imp*b.m*ny;
      b.vx-=imp*a.m*nx; b.vy-=imp*a.m*ny;
    }
  }
}

/* generic tek-kutu fizik adımı: taneciklerin görsel hareketi + duvar/çarpışma fiziği.
   Basınç artık burada ölçülmüyor (gürültülü olduğu için); kinetik teori formülüyle hesaplanıyor. */
function stepBox(particles, box){
  for (var i=0;i<particles.length;i++){
    var p=particles[i];
    p.x+=p.vx; p.y+=p.vy;
    if (p.x-p.r<box.x){ p.x=box.x+p.r; if(p.vx<0) p.vx=-p.vx; }
    if (p.x+p.r>box.x+box.w){ p.x=box.x+box.w-p.r; if(p.vx>0) p.vx=-p.vx; }
    if (p.y-p.r<box.y){ p.y=box.y+p.r; if(p.vy<0) p.vy=-p.vy; }
    if (p.y+p.r>box.y+box.h){ p.y=box.y+box.h-p.r; if(p.vy>0) p.vy=-p.vy; }
  }
  for (i=0;i<particles.length;i++) for (var j=i+1;j<particles.length;j++) collidePair(particles[i],particles[j]);
}

/* ============================ SAHNE DÜNYALARI ============================ */
var W=null;

function buildBox(sc){
  return {
    kind:"box", locked:!!sc.locked, auto:!!sc.auto,
    T: sc.T0||300, n: sc.n0||40, volFrac: sc.vol0!=null?sc.vol0:0.55,
    particles:[], history:[], targetP:null, gx:null, frame:0, inited:false
  };
}
function buildDalton(sc){
  return {
    kind:"dalton", T: sc.T0||320, nA: sc.nA||22, nB: sc.nB||22, vol0: sc.vol0!=null?sc.vol0:0.62,
    filter:"both", particles:[], frame:0, inited:false
  };
}
function buildDiffusion(sc){
  return { kind:"diffusion", particles:[], barrier:true, frame:0, inited:false };
}
function buildEffusion(sc){
  return { kind:"effusion", pl:[], ph:[], frame:0, inited:false };
}

function initScene(){
  var sc=SCENES[idx];
  if (sc.mode==="box") W=buildBox(sc);
  else if (sc.mode==="dalton") W=buildDalton(sc);
  else if (sc.mode==="diffusion") W=buildDiffusion(sc);
  else if (sc.mode==="effusion") W=buildEffusion(sc);
  else W=null;
}

function setTemperature(w, newT){
  newT=clamp(newT,150,900);
  if (!w.inited){ w.T=newT; return; }
  var oldSpeed=speedFromT(w.T), newSpeed=speedFromT(newT);
  var ratio=newSpeed/oldSpeed;
  for (var i=0;i<w.particles.length;i++){ w.particles[i].vx*=ratio; w.particles[i].vy*=ratio; }
  w.T=newT;
}
function setParticleCount(w, newN, box, color){
  if (!w.inited){ w.n=newN; return; }
  var diff=newN-w.n;
  if (diff>0){
    for (var k=0;k<diff;k++) w.particles.push(spawnParticle(box, speedFromT(w.T), 1, color, "g"));
  } else if (diff<0){
    for (k=0;k<-diff && w.particles.length>4;k++) w.particles.splice(Math.floor(Math.random()*w.particles.length),1);
  }
  w.n=newN;
}

/* ============================ ÇİZİM: BOX ============================ */
function computeBox(w, sw, sh){
  var maxW=sw*0.86, minW=maxW*VOL_MIN_FRAC;
  var bw = w.locked ? maxW*w.volFrac : minW+(maxW-minW)*clamp(w.volFrac,0,1);
  var bh = sh*0.46, bx = sw*0.07, by = sh*0.32;
  return { x:bx, y:by, w:bw, h:bh, maxW:maxW };
}

/* Grafiğin x eksenine göre y'yi TAM olarak kinetik teori formülünden hesaplar:
   P = K_P·n·T / V  →  V eksende ise P=k/V (hiperbol), T ya da n eksende ise doğrusal. */
function graphCurveY(sc, W, xv){
  var g=sc.graph;
  if (g.x==="V" && g.y==="P") return K_P*W.n*W.T/xv;
  if (g.x==="T" && g.y==="V") return K_P*W.n*xv/W.targetP;
  if (g.x==="T" && g.y==="P") return K_P*W.n*xv/W.volFrac;
  if (g.x==="n" && g.y==="V") return K_P*W.T*xv/W.targetP;
  return 0;
}
/* Grafik ekseninin aralığını, kaydırıcının gerçek min/maks değerlerinden SABİT olarak belirler
   (ölçüme göre kayan bir eksen, eğri ile noktaların uyumsuz görünmesine yol açıyordu). */
function computeGraphDomain(sc, W){
  var g=sc.graph, xmin, xmax;
  if (g.x==="V"){ var vfMin=SLIDER_META.V.min/100; xmin=VOL_MIN_FRAC+(1-VOL_MIN_FRAC)*vfMin; xmax=1.0; }
  else if (g.x==="T"){ xmin=SLIDER_META.T.min; xmax=SLIDER_META.T.max; }
  else { xmin=(sc.nMin||10); xmax=(sc.nMax||70); }
  var y1=graphCurveY(sc,W,xmin), y2=graphCurveY(sc,W,xmax);
  return { xmin:xmin, xmax:xmax, ymin:0, ymax:Math.max(y1,y2)*1.1 };
}

/* Ders kitabındaki gibi: eksenli, ok uçlu, TEK bir düzgün eğri (hiperbol ya da orijinden geçen doğru).
   Eğri her zaman anlık n/T/hedef-basınç değerlerinden birebir hesaplanır; bu yüzden ölçüm noktaları
   (soluk noktalar) ve güncel değer (parlak nokta) her zaman eğrinin TAM üzerine düşer. */
function drawGraph(W, sc, sw, sh){
  var gx=sw-206, gy=14, gw=192, gh=134;
  var padL=28, padB=20, padT=16, padR=12;
  var ox=gx+padL, oy=gy+gh-padB;
  var exX=gx+gw-padR, eyY=gy+padT;

  ctx.fillStyle="rgba(15,23,42,.92)"; ctx.strokeStyle="#1f2937"; ctx.lineWidth=1;
  ctx.fillRect(gx,gy,gw,gh); ctx.strokeRect(gx,gy,gw,gh);

  ctx.strokeStyle="#64748b"; ctx.lineWidth=1.3;
  ctx.beginPath(); ctx.moveTo(ox,oy); ctx.lineTo(exX,oy); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(ox,oy); ctx.lineTo(ox,eyY); ctx.stroke();
  ctx.fillStyle="#64748b";
  ctx.beginPath(); ctx.moveTo(exX,oy); ctx.lineTo(exX-6,oy-3); ctx.lineTo(exX-6,oy+3); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.moveTo(ox,eyY); ctx.lineTo(ox-3,eyY+6); ctx.lineTo(ox+3,eyY+6); ctx.closePath(); ctx.fill();

  ctx.fillStyle="#cbd5e1"; ctx.font="700 12px system-ui"; ctx.textAlign="left";
  ctx.fillText(sc.graph.xVar, exX-10, oy-6);
  ctx.fillText(sc.graph.yVar, ox+5, eyY+11);
  ctx.fillStyle="#64748b"; ctx.font="10px system-ui";
  ctx.fillText("0", ox-8, oy+11);

  var dom=W.gx; if (!dom) return;
  function mapX(v){ return ox + ((v-dom.xmin)/(dom.xmax-dom.xmin))*(exX-ox-4); }
  function mapY(v){ return oy - ((v-dom.ymin)/(dom.ymax-dom.ymin))*(oy-eyY-4); }

  ctx.beginPath();
  var first=true, step=(dom.xmax-dom.xmin)/60;
  for (var xv=dom.xmin; xv<=dom.xmax+1e-9; xv+=step){
    var yv=graphCurveY(sc,W,xv);
    var px=mapX(xv), py=mapY(yv);
    if (first){ ctx.moveTo(px,py); first=false; } else ctx.lineTo(px,py);
  }
  ctx.strokeStyle=sc.graph.color; ctx.lineWidth=2.2; ctx.stroke();

  var hist=W.history;
  for (var i=0;i<hist.length;i++){
    var qx=mapX(hist[i].x), qy=mapY(hist[i].y);
    ctx.beginPath(); ctx.arc(qx,qy,1.6,0,6.284); ctx.fillStyle="rgba(226,232,240,.45)"; ctx.fill();
  }
  if (hist.length){
    var last=hist[hist.length-1];
    var lx=mapX(last.x), ly=mapY(last.y);
    ctx.beginPath(); ctx.arc(lx,ly,4,0,6.284); ctx.fillStyle="#fff"; ctx.fill();
    ctx.strokeStyle=sc.graph.color; ctx.lineWidth=1.6; ctx.stroke();
  }
}

function drawBoxScene(sc){
  var d=fit(), sw=d[0], sh=d[1];
  ctx.clearRect(0,0,sw,sh);
  var box=computeBox(W, sw, sh);

  if (!W.inited){
    W.particles=[];
    for (var i=0;i<W.n;i++) W.particles.push(spawnParticle(box, speedFromT(W.T), 1, "#fbbf24", "g"));
    W.inited=true;
    var Vrel0=box.w/box.maxW;
    if (W.auto) W.targetP = K_P*W.n*W.T/Vrel0;
    if (sc.graph) W.gx = computeGraphDomain(sc, W);
  }

  stepBox(W.particles, box);
  W.frame++;

  var Vrel=box.w/box.maxW;
  if (W.auto){
    var VrelTarget=clamp(K_P*W.n*W.T/W.targetP, VOL_MIN_FRAC, 1.05);
    W.volFrac += (VrelTarget-W.volFrac)*0.06;
  }
  var Pmodel = K_P*W.n*W.T/Vrel;

  ctx.strokeStyle="#334155"; ctx.lineWidth=2; ctx.strokeRect(box.x,box.y,box.w,box.h);
  if (!W.locked){
    ctx.fillStyle="#fbbf24"; ctx.fillRect(box.x+box.w-4, box.y-12, 8, box.h+24);
    ctx.fillStyle="#fbbf24"; ctx.font="600 11px system-ui"; ctx.textAlign="center";
    ctx.fillText("piston", box.x+box.w, box.y-18);
  }
  for (i=0;i<W.particles.length;i++){
    var p=W.particles[i];
    ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,6.284); ctx.fillStyle=p.color; ctx.fill();
  }

  var hud=["T = "+Math.round(W.T)+" K","n = "+W.n,"V (bağıl) = "+Vrel.toFixed(2),"P (bağıl) = "+Pmodel.toFixed(1)];
  if (sc.showPV) hud.push("P·V ≈ "+(Pmodel*Vrel).toFixed(1));
  ctx.fillStyle="#94a3b8"; ctx.font="600 13px ui-monospace, monospace"; ctx.textAlign="left";
  for (i=0;i<hud.length;i++) ctx.fillText(hud[i], sw*0.07, sh*0.12+i*18);

  if (sc.graph){
    if (W.frame%12===0){
      var xv = sc.graph.x==="V" ? Vrel : (sc.graph.x==="T" ? W.T : W.n);
      var yv = sc.graph.y==="P" ? Pmodel : Vrel;
      W.history.push({x:xv,y:yv});
      if (W.history.length>150) W.history.shift();
    }
    drawGraph(W, sc, sw, sh);
  }
}

/* ============================ ÇİZİM: DALTON ============================ */
function drawDaltonScene(sc){
  var d=fit(), sw=d[0], sh=d[1];
  ctx.clearRect(0,0,sw,sh);
  var box=computeBox({locked:true, volFrac:W.vol0}, sw, sh);

  if (!W.inited){
    W.particles=[];
    for (var i=0;i<W.nA;i++) W.particles.push(spawnParticle(box, speedFromT(W.T), 1, "#fbbf24", "A"));
    for (i=0;i<W.nB;i++) W.particles.push(spawnParticle(box, speedFromT(W.T), 1, "#38bdf8", "B"));
    W.inited=true;
  }

  stepBox(W.particles, box);
  W.frame++;

  var Vrel=W.vol0;
  var pA=K_P*W.nA*W.T/Vrel, pB=K_P*W.nB*W.T/Vrel;

  ctx.strokeStyle="#334155"; ctx.lineWidth=2; ctx.strokeRect(box.x,box.y,box.w,box.h);
  for (i=0;i<W.particles.length;i++){
    var p=W.particles[i];
    if (W.filter!=="both" && p.tag!==W.filter) continue;
    ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,6.284); ctx.fillStyle=p.color; ctx.fill();
  }

  ctx.font="600 13px ui-monospace, monospace"; ctx.textAlign="left";
  ctx.fillStyle="#fbbf24"; ctx.fillText("P (turuncu, A) = "+pA.toFixed(1), sw*0.07, sh*0.12);
  ctx.fillStyle="#38bdf8"; ctx.fillText("P (mavi, B) = "+pB.toFixed(1), sw*0.07, sh*0.12+18);
  ctx.fillStyle="#94a3b8"; ctx.fillText("P (toplam) = "+(pA+pB).toFixed(1), sw*0.07, sh*0.12+36);
}

/* ============================ ÇİZİM: DİFÜZYON ============================ */
function drawDiffusionScene(sc){
  var d=fit(), sw=d[0], sh=d[1];
  ctx.clearRect(0,0,sw,sh);
  var box=computeBox({locked:true, volFrac:0.72}, sw, sh);
  var midX=box.x+box.w/2;

  if (!W.inited){
    W.particles=[];
    var leftBox={x:box.x,y:box.y,w:box.w/2,h:box.h}, rightBox={x:midX,y:box.y,w:box.w/2,h:box.h};
    for (var i=0;i<30;i++) W.particles.push(spawnParticle(leftBox, speedFromT(320), 1, "#fbbf24", "A"));
    for (i=0;i<30;i++) W.particles.push(spawnParticle(rightBox, speedFromT(320), 1, "#38bdf8", "B"));
    W.inited=true; W.barrier=true;
  }

  for (i=0;i<W.particles.length;i++){
    var p=W.particles[i];
    p.x+=p.vx; p.y+=p.vy;
    if (p.x-p.r<box.x){ p.x=box.x+p.r; if(p.vx<0) p.vx=-p.vx; }
    if (p.x+p.r>box.x+box.w){ p.x=box.x+box.w-p.r; if(p.vx>0) p.vx=-p.vx; }
    if (p.y-p.r<box.y){ p.y=box.y+p.r; if(p.vy<0) p.vy=-p.vy; }
    if (p.y+p.r>box.y+box.h){ p.y=box.y+box.h-p.r; if(p.vy>0) p.vy=-p.vy; }
    if (W.barrier){
      if (p.tag==="A" && p.x+p.r>midX){ p.x=midX-p.r; if(p.vx>0) p.vx=-p.vx; }
      if (p.tag==="B" && p.x-p.r<midX){ p.x=midX+p.r; if(p.vx<0) p.vx=-p.vx; }
    }
  }
  for (i=0;i<W.particles.length;i++) for (var j=i+1;j<W.particles.length;j++) collidePair(W.particles[i],W.particles[j]);
  W.frame++;

  ctx.strokeStyle="#334155"; ctx.lineWidth=2; ctx.strokeRect(box.x,box.y,box.w,box.h);
  if (W.barrier){
    ctx.save(); ctx.setLineDash([5,5]); ctx.strokeStyle="#fbbf24"; ctx.lineWidth=2.4;
    ctx.beginPath(); ctx.moveTo(midX,box.y); ctx.lineTo(midX,box.y+box.h); ctx.stroke(); ctx.restore();
  }
  W.particles.forEach(function(p){ ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,6.284); ctx.fillStyle=p.color; ctx.fill(); });

  var mixedRight=0, mixedLeft=0;
  W.particles.forEach(function(p){ if(p.tag==="A" && p.x>midX) mixedRight++; if(p.tag==="B" && p.x<midX) mixedLeft++; });
  ctx.font="600 13px ui-monospace, monospace"; ctx.textAlign="left"; ctx.fillStyle="#94a3b8";
  ctx.fillText("karışım: "+(W.barrier ? "bölme kapalı" : "turuncu sağda "+mixedRight+", mavi solda "+mixedLeft), box.x, box.y-14);
}

/* ============================ ÇİZİM: EFÜZYON ============================ */
function chamberPair(xStart, totalW, sh){
  var y=sh*0.28, h=sh*0.48;
  var srcW=totalW*0.66, recvW=totalW*0.34;
  var source={x:xStart, y:y, w:srcW, h:h};
  var recv={x:xStart+srcW, y:y, w:recvW, h:h};
  var wallX=xStart+srcW;
  return { source:source, recv:recv, wallX:wallX, gap0:y+h*0.40, gap1:y+h*0.60 };
}
function drawChamberOutline(shape){
  ctx.strokeStyle="#334155"; ctx.lineWidth=2;
  ctx.strokeRect(shape.source.x, shape.source.y, (shape.recv.x+shape.recv.w-shape.source.x), shape.source.h);
  ctx.beginPath();
  ctx.moveTo(shape.wallX, shape.source.y); ctx.lineTo(shape.wallX, shape.gap0);
  ctx.moveTo(shape.wallX, shape.gap1); ctx.lineTo(shape.wallX, shape.source.y+shape.source.h);
  ctx.stroke();
  ctx.strokeStyle="#fbbf24"; ctx.lineWidth=2.6;
  ctx.beginPath(); ctx.moveTo(shape.wallX, shape.gap0); ctx.lineTo(shape.wallX, shape.gap1); ctx.stroke();
  ctx.fillStyle="#64748b"; ctx.font="11px system-ui"; ctx.textAlign="left";
  ctx.fillText("kaynak oda", shape.source.x+6, shape.source.y+14);
  ctx.textAlign="right";
  ctx.fillText("karşı oda", shape.recv.x+shape.recv.w-6, shape.source.y+14);
  ctx.textAlign="left";
}
function stepChamber(list, shape){
  var recvCount=0;
  var left=shape.source.x, right=shape.recv.x+shape.recv.w, top=shape.source.y, bottom=shape.source.y+shape.source.h;
  for (var i=0;i<list.length;i++){
    var p=list[i];
    p.x+=p.vx; p.y+=p.vy;
    if (p.x-p.r<left){ p.x=left+p.r; if(p.vx<0) p.vx=-p.vx; }
    if (p.x+p.r>right){ p.x=right-p.r; if(p.vx>0) p.vx=-p.vx; }
    if (p.y-p.r<top){ p.y=top+p.r; if(p.vy<0) p.vy=-p.vy; }
    if (p.y+p.r>bottom){ p.y=bottom-p.r; if(p.vy>0) p.vy=-p.vy; }
    if (Math.abs(p.x-shape.wallX)<p.r && (p.y<shape.gap0 || p.y>shape.gap1)){
      if (p.x<shape.wallX){ p.x=shape.wallX-p.r; if(p.vx>0) p.vx=-p.vx; }
      else { p.x=shape.wallX+p.r; if(p.vx<0) p.vx=-p.vx; }
    }
    if (p.x>shape.wallX) recvCount++;
  }
  for (i=0;i<list.length;i++) for (var j=i+1;j<list.length;j++) collidePair(list[i],list[j]);
  return recvCount;
}
function drawEffusionScene(sc){
  var d=fit(), sw=d[0], sh=d[1];
  ctx.clearRect(0,0,sw,sh);
  var totalW=sw*0.42;
  var shapeL=chamberPair(sw*0.05, totalW, sh);
  var shapeH=chamberPair(sw*0.53, totalW, sh);

  if (!W.inited){
    W.pl=[]; W.ph=[];
    for (var i=0;i<22;i++) W.pl.push(spawnParticle(shapeL.source, BASE_SPEED*2.0, 1, "#38bdf8", "L", 2.6));
    for (i=0;i<22;i++) W.ph.push(spawnParticle(shapeH.source, BASE_SPEED*0.5, 4, "#fb7185", "H", 3.4));
    W.inited=true;
  }

  var recvL=stepChamber(W.pl, shapeL);
  var recvH=stepChamber(W.ph, shapeH);
  W.frame++;

  drawChamberOutline(shapeL); drawChamberOutline(shapeH);
  W.pl.concat(W.ph).forEach(function(p){ ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,6.284); ctx.fillStyle=p.color; ctx.fill(); });

  ctx.font="600 13px ui-monospace, monospace"; ctx.textAlign="left";
  ctx.fillStyle="#38bdf8"; ctx.fillText("hafif gaz (H₂) — karşı odada: "+recvL+" / "+W.pl.length, shapeL.source.x, shapeL.source.y-16);
  ctx.fillStyle="#fb7185"; ctx.fillText("ağır gaz (O₂) — karşı odada: "+recvH+" / "+W.ph.length, shapeH.source.x, shapeH.source.y-16);

  var bx=sw*0.05, by=sh*0.86, bw=sw*0.42;
  ctx.fillStyle="#1f2937"; ctx.fillRect(bx,by,bw,14); ctx.fillRect(bx,by+22,bw,14);
  ctx.fillStyle="#38bdf8"; ctx.fillRect(bx,by,bw*(recvL/Math.max(W.pl.length,1)),14);
  ctx.fillStyle="#fb7185"; ctx.fillRect(bx,by+22,bw*(recvH/Math.max(W.ph.length,1)),14);
}

/* ============================ ANA DÖNGÜ ============================ */
function fit(){
  var r=cv.getBoundingClientRect();
  var dpr=window.devicePixelRatio||1;
  if (cv.width!==Math.round(r.width*dpr)){ cv.width=Math.round(r.width*dpr); cv.height=Math.round(r.height*dpr); }
  ctx.setTransform(dpr,0,0,dpr,0,0);
  return [r.width, r.height];
}

function loop(){
  var sc=SCENES[idx];
  if (sc.mode==="box" && W) drawBoxScene(sc);
  else if (sc.mode==="dalton" && W) drawDaltonScene(sc);
  else if (sc.mode==="diffusion" && W) drawDiffusionScene(sc);
  else if (sc.mode==="effusion" && W) drawEffusionScene(sc);
  requestAnimationFrame(loop);
}

/* ============================ ARAYÜZ ============================ */
var idx=0;
var cv=document.getElementById("cv"), ctx=cv.getContext("2d");
var slab=document.getElementById("slab");

var SLIDER_META = {
  T:{min:200,max:650,step:10,label:"Sıcaklık (K)"},
  V:{min:16,max:100,step:1,label:"Hacim (%)"},
  n:{min:10,max:70,step:2,label:"Tanecik sayısı"}
};

function render(){
  var sc=SCENES[idx];
  document.getElementById("step").textContent=sc.step;
  document.getElementById("title").textContent=sc.title;
  document.getElementById("say").textContent=sc.say;
  document.getElementById("say").className = sc.say ? "say" : "say hide";
  document.getElementById("note").innerHTML=sc.note;
  document.getElementById("count").textContent=(idx+1)+" / "+SCENES.length;
  document.getElementById("prev").disabled = idx===0;
  document.getElementById("next").disabled = idx===SCENES.length-1;

  var isSlab = sc.mode==="slab";
  cv.className = isSlab ? "hide" : "";
  slab.className = isSlab ? "slab" : "slab hide";
  if (isSlab){
    slab.innerHTML = sc.slab==="combined" ? COMBINED_HTML
      : sc.slab==="ideal" ? IDEAL_HTML
      : sc.slab==="real" ? REAL_HTML
      : END_HTML;
  }

  initScene();

  var ex=document.getElementById("extra"); ex.innerHTML="";

  if (sc.mode==="box" && sc.sliders && sc.sliders.length){
    sc.sliders.forEach(function(key){
      var meta = SLIDER_META[key];
      var min=meta.min, max = key==="n" ? (sc.nMax||meta.max) : meta.max;
      var minN = key==="n" ? (sc.nMin||meta.min) : meta.min;
      var startVal = key==="T" ? (sc.T0||300) : key==="n" ? (sc.n0||40) : Math.round((sc.vol0||0.5)*100);
      var wrap=document.createElement("span"); wrap.className="ctrl";
      var lab=document.createElement("span"); lab.textContent=meta.label;
      var inp=document.createElement("input"); inp.type="range";
      inp.min=key==="n"?minN:min; inp.max=max; inp.step=meta.step; inp.value=startVal;
      var val=document.createElement("span"); val.className="val"; val.textContent=startVal;
      inp.oninput=function(){
        val.textContent=this.value;
        if (!W) return;
        if (key==="T") setTemperature(W, Number(this.value));
        else if (key==="V") W.volFrac=Number(this.value)/100;
        else if (key==="n") setParticleCount(W, Number(this.value), computeBox(W, cv.getBoundingClientRect().width, cv.getBoundingClientRect().height), "#fbbf24");
      };
      wrap.appendChild(lab); wrap.appendChild(inp); wrap.appendChild(val);
      ex.appendChild(wrap);
    });
  }

  if (sc.mode==="dalton" && sc.speciesToggle){
    [["both","ikisi birden"],["A","sadece turuncu"],["B","sadece mavi"]].forEach(function(k){
      var b=document.createElement("button");
      b.textContent=k[1]; b.className = W.filter===k[0] ? "on" : "";
      b.onclick=function(){
        W.filter=k[0];
        Array.prototype.slice.call(ex.children).forEach(function(c){ c.className=""; });
        b.className="on";
      };
      ex.appendChild(b);
    });
  }

  if (sc.mode==="diffusion"){
    var tb=document.createElement("button");
    tb.textContent = W.barrier ? "bölmeyi kaldır" : "bölmeyi yerleştir";
    tb.onclick=function(){
      W.barrier=!W.barrier;
      tb.textContent = W.barrier ? "bölmeyi kaldır" : "bölmeyi yerleştir";
      tb.className = W.barrier ? "" : "on";
    };
    ex.appendChild(tb);
    var rb2=document.createElement("button");
    rb2.textContent="sıfırla";
    rb2.onclick=function(){ initScene(); render(); };
    ex.appendChild(rb2);
  }

  if (sc.mode==="effusion" && sc.resettable){
    var rb=document.createElement("button");
    rb.textContent="sıfırla";
    rb.onclick=function(){ initScene(); };
    ex.appendChild(rb);
  }
}

function go(n){
  idx=Math.max(0, Math.min(SCENES.length-1, idx+n));
  render();
}
document.getElementById("next").onclick=function(){go(1)};
document.getElementById("prev").onclick=function(){go(-1)};
document.getElementById("fs").onclick=function(){
  if (document.fullscreenElement) document.exitFullscreen();
  else document.documentElement.requestFullscreen();
};
document.addEventListener("keydown",function(e){
  if (e.target && (e.target.type==="range")) return;
  if (e.key==="ArrowRight"||e.key===" "||e.key==="PageDown"){ e.preventDefault(); go(1); }
  if (e.key==="ArrowLeft"||e.key==="PageUp"){ e.preventDefault(); go(-1); }
});

render();
requestAnimationFrame(loop);

if ("serviceWorker" in navigator){
  window.addEventListener("load", function(){
    navigator.serviceWorker.register("sw.js").catch(function(){});
  });
}
</script>
