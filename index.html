/* ============================================================
   YARDIMCI FONKSİYONLAR
   ============================================================ */
var DEG = Math.PI/180;
function rnd(a,b){ return a+Math.random()*(b-a); }
function clamp(v,a,b){ return v<a?a:(v>b?b:v); }
function hexToRgb(hex){
  hex=hex.replace('#','');
  if (hex.length===3) hex=hex.split('').map(function(c){return c+c;}).join('');
  var n=parseInt(hex,16); return [n>>16&255, n>>8&255, n&255];
}
function shade(hex, amt){
  var rgb=hexToRgb(hex);
  function f(v){ v = amt>0 ? v+(255-v)*amt : v+v*amt; return Math.max(0,Math.min(255,Math.round(v))); }
  return 'rgb('+f(rgb[0])+','+f(rgb[1])+','+f(rgb[2])+')';
}
function lighten(hex,amt){ return shade(hex, Math.abs(amt)); }
function darken(hex,amt){ return shade(hex, -Math.abs(amt)); }

/* ============================================================
   FİZİK MOTORU — 3 BOYUTLU
   Silindirik bir kap (piston ekseni x); y-z düzleminde dairesel
   kesit. Tanecikler gerçek 3B konum/hız taşır; küresel çarpışma
   ve dairesel duvar sekmesiyle sekiyorlar.
   ============================================================ */
var BASE_SPEED = 0.052;
var K_P = 50/(44*300);
var VOL_MIN_FRAC = 0.16;
function speedFromT(T){ return BASE_SPEED*Math.sqrt(T/300); }

function spawn3D(L, R, speed, mass, color, tag, r){
  r = r || 0.052;
  var rad = Math.sqrt(Math.random())*Math.max(R-r,0.01);
  var ang = Math.random()*Math.PI*2;
  var x = rnd(r, Math.max(L-r,r+0.001));
  var y = rad*Math.cos(ang), z = rad*Math.sin(ang);
  var th = Math.random()*Math.PI*2, ph = Math.acos(2*Math.random()-1);
  var vx=Math.sin(ph)*Math.cos(th)*speed, vy=Math.sin(ph)*Math.sin(th)*speed, vz=Math.cos(ph)*speed;
  return {x:x,y:y,z:z,vx:vx,vy:vy,vz:vz,r:r,m:mass,color:color,tag:tag};
}
function collide3D(a,b){
  var dx=b.x-a.x, dy=b.y-a.y, dz=b.z-a.z, dist=Math.sqrt(dx*dx+dy*dy+dz*dz);
  var minD=a.r+b.r;
  if (dist>0 && dist<minD){
    var overlap=(minD-dist)/2, nx=dx/dist, ny=dy/dist, nz=dz/dist;
    a.x-=nx*overlap; a.y-=ny*overlap; a.z-=nz*overlap;
    b.x+=nx*overlap; b.y+=ny*overlap; b.z+=nz*overlap;
    var dvx=b.vx-a.vx, dvy=b.vy-a.vy, dvz=b.vz-a.vz;
    var vn=dvx*nx+dvy*ny+dvz*nz;
    if (vn<0){
      var imp=(2*vn)/(a.m+b.m);
      a.vx+=imp*b.m*nx; a.vy+=imp*b.m*ny; a.vz+=imp*b.m*nz;
      b.vx-=imp*a.m*nx; b.vy-=imp*a.m*ny; b.vz-=imp*a.m*nz;
    }
  }
}
/* xMin..xMax: taneciğin ekseninde serbest olduğu aralık (bölmeli sahnelerde iç duvarlar da olabilir) */
function step3D(particles, xMin, xMax, R, walls){
  for (var i=0;i<particles.length;i++){
    var p=particles[i];
    p.x+=p.vx; p.y+=p.vy; p.z+=p.vz;
    if (p.x-p.r<xMin){ p.x=xMin+p.r; if(p.vx<0) p.vx=-p.vx; }
    if (p.x+p.r>xMax){ p.x=xMax-p.r; if(p.vx>0) p.vx=-p.vx; }
    var d=Math.sqrt(p.y*p.y+p.z*p.z), maxd=R-p.r;
    if (d>maxd && d>0){
      var nx=p.y/d, nz=p.z/d;
      p.y=nx*maxd; p.z=nz*maxd;
      var vn=p.vy*nx+p.vz*nz;
      if (vn>0){ p.vy-=2*vn*nx; p.vz-=2*vn*nz; }
    }
    if (walls){
      for (var w=0; w<walls.length; w++){
        var wl=walls[w];
        if (!wl.open && Math.abs(p.x-wl.x)<p.r){
          var through = wl.hole && (p.y*p.y+p.z*p.z) < wl.hole*wl.hole;
          if (!through){
            if (p.x<wl.x){ p.x=wl.x-p.r; if(p.vx>0) p.vx=-p.vx; }
            else { p.x=wl.x+p.r; if(p.vx<0) p.vx=-p.vx; }
          }
        }
      }
    }
  }
  for (i=0;i<particles.length;i++) for (var j=i+1;j<particles.length;j++) collide3D(particles[i],particles[j]);
}

/* ============================================================
   3B PROJEKSİYON (kabine/oblique izdüşüm) — WebGL olmadan,
   gerçek derinlik hissi veren sağlam ve hızlı bir teknik.
   ============================================================ */
var OB_A = 30*DEG, OB_COS=Math.cos(OB_A), OB_SIN=Math.sin(OB_A), OB_K=0.5;
function mkProjector(cx,cy,scale){
  return function(x,y,z){
    return [ cx + x*scale + z*OB_COS*OB_K*scale, cy + y*scale - z*OB_SIN*OB_K*scale ];
  };
}
function ellipsePts(proj, xPos, R, n){
  var pts=[];
  for (var i=0;i<n;i++){
    var t=i/n*Math.PI*2;
    pts.push(proj(xPos, R*Math.cos(t), R*Math.sin(t)));
  }
  return pts;
}
function extentOf(pts){
  var top=0,bot=0,minx=0,maxx=0;
  for (var i=1;i<pts.length;i++){
    if (pts[i][1]<pts[top][1]) top=i;
    if (pts[i][1]>pts[bot][1]) bot=i;
    if (pts[i][0]<pts[minx][0]) minx=i;
    if (pts[i][0]>pts[maxx][0]) maxx=i;
  }
  return {top:top,bot:bot,minx:minx,maxx:maxx};
}

/* ============================================================
   SPRITE ÖNBELLEĞİ — küresel, ışıklı tanecik ikonları
   ============================================================ */
var SPRITES={};
function getSprite(color){
  if (SPRITES[color]) return SPRITES[color];
  var s=72, c=document.createElement("canvas"); c.width=s; c.height=s;
  var g=c.getContext("2d");
  var grad=g.createRadialGradient(s*0.33,s*0.30,s*0.03, s*0.5,s*0.5,s*0.5);
  grad.addColorStop(0,"#ffffff");
  grad.addColorStop(0.20,lighten(color,0.45));
  grad.addColorStop(0.55,color);
  grad.addColorStop(1,darken(color,0.5));
  g.fillStyle=grad;
  g.beginPath(); g.arc(s/2,s/2,s*0.44,0,Math.PI*2); g.fill();
  SPRITES[color]=c;
  return c;
}
function drawParticles3D(proj, list, R){
  var arr = list.slice().sort(function(a,b){ return b.z-a.z; });
  for (var i=0;i<arr.length;i++){
    var p=arr[i];
    var sc = proj(p.x,p.y,p.z);
    var depth = clamp((p.z/R+1)/2, 0, 1);
    var pxr = Math.max(2.2, p.r*proj.scale*(0.78+depth*0.5));
    var alpha = 0.72+depth*0.28;
    ctx.globalAlpha=alpha;
    var spr=getSprite(p.color);
    ctx.drawImage(spr, sc[0]-pxr, sc[1]-pxr, pxr*2, pxr*2);
    ctx.globalAlpha=1;
  }
}

/* ============================================================
   GÖSTERGELER: analog basınç saati ve termometre
   ============================================================ */
function drawGauge(cx,cy,R,value,vmin,vmax,label,unitLabel){
  var grad=ctx.createRadialGradient(cx-R*0.3,cy-R*0.3,R*0.1,cx,cy,R);
  grad.addColorStop(0,"#3a4658"); grad.addColorStop(1,"#131926");
  ctx.beginPath(); ctx.arc(cx,cy,R,0,Math.PI*2); ctx.fillStyle=grad; ctx.fill();
  ctx.lineWidth=2.4; ctx.strokeStyle="#05070c"; ctx.stroke();
  ctx.beginPath(); ctx.arc(cx,cy,R*0.84,0,Math.PI*2); ctx.fillStyle="#0b1220"; ctx.fill();
  ctx.strokeStyle="#1f2937"; ctx.lineWidth=1; ctx.stroke();

  var a0=140*DEG, a1=400*DEG, steps=10;
  for (var i=0;i<=steps;i++){
    var a=a0+(a1-a0)*(i/steps);
    var r1=R*0.84, r2=(i%5===0)?R*0.66:R*0.73;
    ctx.beginPath();
    ctx.moveTo(cx+Math.cos(a)*r1, cy+Math.sin(a)*r1);
    ctx.lineTo(cx+Math.cos(a)*r2, cy+Math.sin(a)*r2);
    ctx.strokeStyle=(i%5===0)?"#fbbf24":"#475569"; ctx.lineWidth=(i%5===0)?2:1;
    ctx.stroke();
  }
  var t=clamp((value-vmin)/(vmax-vmin),0,1);
  var na=a0+(a1-a0)*t;
  ctx.save(); ctx.translate(cx,cy); ctx.rotate(na);
  ctx.beginPath(); ctx.moveTo(-R*0.14,-R*0.035); ctx.lineTo(R*0.64,0); ctx.lineTo(-R*0.14,R*0.035); ctx.closePath();
  ctx.fillStyle="#fb7185"; ctx.fill();
  ctx.restore();
  ctx.beginPath(); ctx.arc(cx,cy,R*0.1,0,Math.PI*2); ctx.fillStyle="#e2e8f0"; ctx.fill();

  ctx.fillStyle="#cbd5e1"; ctx.font="700 "+Math.max(9,R*0.24)+"px system-ui"; ctx.textAlign="center";
  ctx.fillText(Math.round(value)+(unitLabel||""), cx, cy+R*0.42);
  ctx.fillStyle="#64748b"; ctx.font="600 "+Math.max(8,R*0.19)+"px system-ui";
  ctx.fillText(label, cx, cy+R*1.32);
}
function drawThermo(cx,cy,h,value,vmin,vmax){
  var w=h*0.24, bulbR=w*0.95;
  var t=clamp((value-vmin)/(vmax-vmin),0,1);
  ctx.beginPath();
  if (ctx.roundRect) ctx.roundRect(cx-w/2, cy-h, w, h-bulbR*0.4, w/2); else ctx.rect(cx-w/2,cy-h,w,h-bulbR*0.4);
  ctx.fillStyle="rgba(226,232,240,.14)"; ctx.fill();
  ctx.strokeStyle="rgba(226,232,240,.4)"; ctx.lineWidth=1.3; ctx.stroke();
  ctx.beginPath(); ctx.arc(cx,cy,bulbR,0,Math.PI*2); ctx.fillStyle="#0b1220"; ctx.fill();
  ctx.strokeStyle="rgba(226,232,240,.4)"; ctx.stroke();

  var top=cy-bulbR-((h-bulbR*0.4)-2)*t;
  ctx.beginPath();
  var rr=w*0.3;
  if (ctx.roundRect) ctx.roundRect(cx-rr, top, rr*2, (cy-bulbR)-top+bulbR+2, rr);
  else ctx.rect(cx-rr, top, rr*2, (cy-bulbR)-top+bulbR+2);
  ctx.fillStyle="#fb7185"; ctx.fill();
  ctx.beginPath(); ctx.arc(cx,cy,bulbR*0.7,0,Math.PI*2); ctx.fillStyle="#fb7185"; ctx.fill();
  ctx.fillStyle="#64748b"; ctx.font="600 "+Math.max(8,w*0.7)+"px system-ui"; ctx.textAlign="center";
  ctx.fillText("T", cx, cy+bulbR*2.0);
}

/* ============================================================
   3B SİLİNDİR ÇİZİMİ (gerçek pistonlu kap görünümü)
   ============================================================ */
function drawGround(cx,cy,scale,L,R){
  ctx.save();
  var gy=cy+R*scale*1.28;
  ctx.filter="blur(9px)";
  ctx.beginPath();
  ctx.ellipse(cx+L*scale*0.5, gy, L*scale*0.62, R*scale*0.34, 0, 0, Math.PI*2);
  ctx.fillStyle="rgba(0,0,0,.45)"; ctx.fill();
  ctx.restore();
}
function drawCapDisc(pts, stops, opts){
  opts=opts||{};
  ctx.beginPath();
  pts.forEach(function(p,i){ i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]); });
  ctx.closePath();
  var e=extentOf(pts);
  var grad=ctx.createLinearGradient(pts[e.minx][0],0,pts[e.maxx][0],0);
  stops.forEach(function(s){ grad.addColorStop(s[0],s[1]); });
  ctx.fillStyle=grad; ctx.fill();
  ctx.lineWidth=opts.lw||1.6; ctx.strokeStyle=opts.stroke||"rgba(5,7,12,.75)"; ctx.stroke();
  return e;
}
function drawTubeBody(leftPts,rightPts){
  var eL=extentOf(leftPts), eR=extentOf(rightPts);
  var x0=leftPts[eL.top][0], x1=rightPts[eR.top][0];
  var y0=leftPts[eL.top][1], y1=leftPts[eL.bot][1];
  if (x1<x0){ var tmp=x0; x0=x1; x1=tmp; }
  var grad=ctx.createLinearGradient(0,y0,0,y1);
  grad.addColorStop(0,"rgba(180,220,255,.24)");
  grad.addColorStop(0.14,"rgba(180,220,255,.07)");
  grad.addColorStop(0.5,"rgba(120,160,200,.045)");
  grad.addColorStop(0.86,"rgba(180,220,255,.07)");
  grad.addColorStop(1,"rgba(180,220,255,.24)");
  ctx.fillStyle=grad;
  ctx.fillRect(x0,y0,x1-x0,y1-y0);
  ctx.strokeStyle="rgba(148,197,255,.32)"; ctx.lineWidth=1.3;
  ctx.beginPath(); ctx.moveTo(x0,y0); ctx.lineTo(x1,y0); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x0,y1); ctx.lineTo(x1,y1); ctx.stroke();
  return {x0:x0,x1:x1,y0:y0,y1:y1};
}
function hatch(pts, dir){
  var e=extentOf(pts);
  ctx.save();
  ctx.beginPath();
  pts.forEach(function(p,i){ i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]); });
  ctx.closePath(); ctx.clip();
  ctx.strokeStyle="rgba(10,10,5,.28)"; ctx.lineWidth=1.4;
  var x0=pts[e.minx][0], x1=pts[e.maxx][0], y0=pts[e.top][1], y1=pts[e.bot][1];
  for (var x=x0-((y1-y0)); x<x1+((y1-y0)); x+=6){
    ctx.beginPath(); ctx.moveTo(x,y0-4); ctx.lineTo(x+dir*(y1-y0),y1+4); ctx.stroke();
  }
  ctx.restore();
}
function boltRing(pts,color){
  var e=extentOf(pts);
  var cx=(pts[e.minx][0]+pts[e.maxx][0])/2, cy=(pts[e.top][1]+pts[e.bot][1])/2;
  var rx=(pts[e.maxx][0]-pts[e.minx][0])/2*0.72, ry=(pts[e.bot][1]-pts[e.top][1])/2*0.72;
  for (var i=0;i<6;i++){
    var a=i/6*Math.PI*2;
    var bx=cx+Math.cos(a)*rx, by=cy+Math.sin(a)*ry;
    ctx.beginPath(); ctx.arc(bx,by,Math.max(1.6,rx*0.07),0,Math.PI*2);
    ctx.fillStyle="#1e2634"; ctx.fill(); ctx.strokeStyle="#000"; ctx.lineWidth=0.6; ctx.stroke();
  }
}
/* Genel amaçlı silindir çizer: cx,cy,scale,L,R dünya birimleri.
   rightMode: "piston" | "locked" | "wall"(hem sol hem sağ sabit — iki odalı sahnelerde ara duvar)
   showInstruments: gauge+termometre çizilsin mi (sol sabit uca monte) */
function drawCylinder(cx, cy, scale, L, R, rightMode, showInstruments, Pval, Pmax, Tval, Tmax){
  var proj = mkProjector(cx,cy,scale); proj.scale=scale;
  var N=56;
  var leftPts = ellipsePts(proj, 0, R, N);
  var rightPts = ellipsePts(proj, L, R, N);

  drawGround(cx,cy,scale,L,R);
  drawTubeBody(leftPts, rightPts);

  var eL = drawCapDisc(leftPts, [[0,"#293449"],[0.5,"#7c8aa0"],[1,"#1c2432"]]);
  hatch(leftPts, 1);
  boltRing(leftPts);

  if (rightMode==="piston"){
    var eR = drawCapDisc(rightPts, [[0,"#8a6d1f"],[0.45,"#f2c14e"],[0.55,"#f2c14e"],[1,"#6e5518"]]);
    hatch(rightPts, -1);
    var rodLen = R*scale*0.9;
    var rTop=rightPts[eR.top], rMid=[(rightPts[eR.minx][0]+rightPts[eR.maxx][0])/2, (rightPts[eR.top][1]+rightPts[eR.bot][1])/2];
    ctx.strokeStyle="#94a3b8"; ctx.lineWidth=Math.max(3,R*scale*0.11); ctx.lineCap="round";
    ctx.beginPath(); ctx.moveTo(rMid[0],rMid[1]); ctx.lineTo(rMid[0]+rodLen,rMid[1]); ctx.stroke();
    ctx.fillStyle="#cbd5e1";
    ctx.beginPath(); ctx.roundRect ? ctx.roundRect(rMid[0]+rodLen-2, rMid[1]-R*scale*0.32, R*scale*0.16, R*scale*0.64, 3) : ctx.rect(rMid[0]+rodLen-2, rMid[1]-R*scale*0.32, R*scale*0.16, R*scale*0.64);
    ctx.fill();
    ctx.fillStyle="#fbbf24"; ctx.font="700 "+Math.max(10,R*scale*0.22)+"px system-ui"; ctx.textAlign="center";
    ctx.fillText("piston", rMid[0]+rodLen*0.5, rMid[1]-R*scale*1.15);
  } else {
    var eR2 = drawCapDisc(rightPts, [[0,"#293449"],[0.5,"#7c8aa0"],[1,"#1c2432"]]);
    hatch(rightPts, -1);
    boltRing(rightPts);
    if (rightMode==="locked"){
      var rc=[(rightPts[eR2.minx][0]+rightPts[eR2.maxx][0])/2, (rightPts[eR2.top][1]+rightPts[eR2.bot][1])/2];
      ctx.fillStyle="#0b1220"; ctx.strokeStyle="#fbbf24"; ctx.lineWidth=1.6;
      var lr=Math.max(7,R*scale*0.16);
      ctx.beginPath(); ctx.roundRect ? ctx.roundRect(rc[0]-lr*0.7, rc[1]-lr*0.15, lr*1.4, lr*1.05, 2) : ctx.rect(rc[0]-lr*0.7,rc[1]-lr*0.15,lr*1.4,lr*1.05);
      ctx.fill(); ctx.stroke();
      ctx.beginPath(); ctx.arc(rc[0],rc[1]-lr*0.15,lr*0.55,Math.PI,0); ctx.strokeStyle="#fbbf24"; ctx.lineWidth=1.6; ctx.stroke();
      ctx.fillStyle="#fbbf24"; ctx.font="700 "+Math.max(9,R*scale*0.19)+"px system-ui"; ctx.textAlign="center";
      ctx.fillText("sabit hacim", rc[0], rc[1]+R*scale*1.05);
    }
  }

  if (showInstruments){
    var stubX = leftPts[eL.top][0]+ (rightPts[0][0]>leftPts[0][0]?1:-1)*R*scale*0.55;
    var stubTopY = leftPts[eL.top][1];
    var gaugeR = R*scale*0.62;
    var gaugeCy = stubTopY - R*scale*1.05;
    ctx.strokeStyle="#475569"; ctx.lineWidth=Math.max(2,R*scale*0.06);
    ctx.beginPath(); ctx.moveTo(stubX, stubTopY); ctx.lineTo(stubX, gaugeCy+gaugeR*0.85); ctx.stroke();
    drawGauge(stubX, gaugeCy, gaugeR, Pval, 0, Pmax, "BASINÇ", "");

    var thermoX = leftPts[eL.top][0]+ (rightPts[0][0]>leftPts[0][0]?1:-1)*R*scale*0.05;
    var thermoBottomY = leftPts[eL.bot][1];
    var thStub = R*scale*0.22, thH = R*scale*0.82;
    ctx.strokeStyle="#475569"; ctx.lineWidth=Math.max(2,R*scale*0.05);
    ctx.beginPath(); ctx.moveTo(thermoX, thermoBottomY); ctx.lineTo(thermoX, thermoBottomY + thStub); ctx.stroke();
    drawThermo(thermoX, thermoBottomY + thStub + thH, thH, Tval, 150, Tmax, "");
  }
  return {leftPts:leftPts, rightPts:rightPts, proj:proj};
}

var W=null;
var WORLD_R = 1.0;
var WORLD_LMAX = 5.6;

function buildBox3D(sc){
  return {
    kind:"box3d", locked:!!sc.locked, auto:!!sc.auto, combined:!!sc.combined,
    T: sc.T0||300, n: sc.n0||40, volFrac: sc.vol0!=null?sc.vol0:0.55,
    particles:[], history:[], targetP:null, gx:null, frame:0, inited:false, baseline:null
  };
}
function buildDalton3D(sc){
  return { kind:"dalton3d", T: sc.T0||320, nA: sc.nA||22, nB: sc.nB||22, vol0: sc.vol0!=null?sc.vol0:0.62,
    filter:"both", particles:[], frame:0, inited:false };
}
function buildDiffusion3D(sc){ return { kind:"diffusion3d", particles:[], barrier:true, frame:0, inited:false }; }
function buildEffusion3D(sc){ return { kind:"effusion3d", pl:[], ph:[], frame:0, inited:false }; }

function currentLen(volFrac, locked){
  var Lmin=WORLD_LMAX*VOL_MIN_FRAC;
  return locked ? WORLD_LMAX*volFrac : Lmin+(WORLD_LMAX-Lmin)*clamp(volFrac,0,1);
}

function initScene(){
  var sc=SCENES[idx];
  if (sc.mode==="box3d") W=buildBox3D(sc);
  else if (sc.mode==="dalton3d") W=buildDalton3D(sc);
  else if (sc.mode==="diffusion3d") W=buildDiffusion3D(sc);
  else if (sc.mode==="effusion3d") W=buildEffusion3D(sc);
  else if (sc.mode==="slab"){
    var bg=sc.bg||{T0:300,n0:40,vol0:0.55};
    W=buildBox3D({locked:true, T0:bg.T0, n0:bg.n0, vol0:bg.vol0});
  }
  else W=null;
}

function setTemperature(w, newT){
  newT=clamp(newT,150,900);
  if (!w.inited){ w.T=newT; return; }
  var oldSpeed=speedFromT(w.T), newSpeed=speedFromT(newT);
  var ratio=newSpeed/oldSpeed;
  for (var i=0;i<w.particles.length;i++){ w.particles[i].vx*=ratio; w.particles[i].vy*=ratio; w.particles[i].vz*=ratio; }
  w.T=newT;
}
function setParticleCount(w, newN, L, R, color){
  if (!w.inited){ w.n=newN; return; }
  var diff=newN-w.n;
  if (diff>0){
    for (var k=0;k<diff;k++) w.particles.push(spawn3D(L, R, speedFromT(w.T), 1, color, "g"));
  } else if (diff<0){
    for (k=0;k<-diff && w.particles.length>4;k++) w.particles.splice(Math.floor(Math.random()*w.particles.length),1);
  }
  w.n=newN;
}

/* ============================================================
   GRAFİK (P-V, V-T, P-T ilişkileri) — 2B veri paneli
   ============================================================ */
function graphCurveY(sc, W, xv){
  var g=sc.graph;
  if (g.x==="V" && g.y==="P") return K_P*W.n*W.T/xv;
  if (g.x==="T" && g.y==="V") return K_P*W.n*xv/W.targetP;
  if (g.x==="T" && g.y==="P") return K_P*W.n*xv/W.volFrac;
  if (g.x==="n" && g.y==="V") return K_P*W.T*xv/W.targetP;
  return 0;
}
function computeGraphDomain(sc, W){
  var g=sc.graph, xmin, xmax;
  if (g.x==="V"){ var vfMin=SLIDER_META.V.min/100; xmin=VOL_MIN_FRAC+(1-VOL_MIN_FRAC)*vfMin; xmax=1.0; }
  else if (g.x==="T"){ xmin=SLIDER_META.T.min; xmax=SLIDER_META.T.max; }
  else { xmin=(sc.nMin||10); xmax=(sc.nMax||70); }
  var y1=graphCurveY(sc,W,xmin), y2=graphCurveY(sc,W,xmax);
  return { xmin:xmin, xmax:xmax, ymin:0, ymax:Math.max(y1,y2)*1.1 };
}
function drawGraph(W, sc, sw, sh, maxH){
  var gw=clamp(sw*0.30, 128, 192), gh=gw*0.70;
  if (maxH && gh>maxH){ gh=Math.max(34,maxH); gw=gh/0.70; }
  var gx=sw-gw-12, gy=12;
  var rect={gx:gx,gy:gy,gw:gw,gh:gh};
  var padL=26, padB=18, padT=14, padR=10;
  var ox=gx+padL, oy=gy+gh-padB;
  var exX=gx+gw-padR, eyY=gy+padT;

  ctx.fillStyle="rgba(15,23,42,.92)"; ctx.strokeStyle="#1f2937"; ctx.lineWidth=1;
  ctx.fillRect(gx,gy,gw,gh); ctx.strokeRect(gx,gy,gw,gh);

  ctx.strokeStyle="#64748b"; ctx.lineWidth=1.3;
  ctx.beginPath(); ctx.moveTo(ox,oy); ctx.lineTo(exX,oy); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(ox,oy); ctx.lineTo(ox,eyY); ctx.stroke();
  ctx.fillStyle="#64748b";
  ctx.beginPath(); ctx.moveTo(exX,oy); ctx.lineTo(exX-6,oy-3); ctx.lineTo(exX-6,oy+3); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.moveTo(ox,eyY); ctx.lineTo(ox-3,eyY+6); ctx.lineTo(ox+3,eyY+6); ctx.closePath(); ctx.fill();

  ctx.fillStyle="#cbd5e1"; ctx.font="700 12px system-ui"; ctx.textAlign="left";
  ctx.fillText(sc.graph.xVar, exX-10, oy-6);
  ctx.fillText(sc.graph.yVar, ox+5, eyY+11);
  ctx.fillStyle="#64748b"; ctx.font="10px system-ui";
  ctx.fillText("0", ox-8, oy+11);

  var dom=W.gx; if (!dom) return rect;
  function mapX(v){ return ox + ((v-dom.xmin)/(dom.xmax-dom.xmin))*(exX-ox-4); }
  function mapY(v){ return oy - ((v-dom.ymin)/(dom.ymax-dom.ymin))*(oy-eyY-4); }

  ctx.beginPath();
  var first=true, step=(dom.xmax-dom.xmin)/60;
  for (var xv=dom.xmin; xv<=dom.xmax+1e-9; xv+=step){
    var yv=graphCurveY(sc,W,xv);
    var px=mapX(xv), py=mapY(yv);
    if (first){ ctx.moveTo(px,py); first=false; } else ctx.lineTo(px,py);
  }
  ctx.strokeStyle=sc.graph.color; ctx.lineWidth=2.2; ctx.stroke();

  var hist=W.history;
  for (var i=0;i<hist.length;i++){
    var qx=mapX(hist[i].x), qy=mapY(hist[i].y);
    ctx.beginPath(); ctx.arc(qx,qy,1.6,0,6.284); ctx.fillStyle="rgba(226,232,240,.45)"; ctx.fill();
  }
  if (hist.length){
    var last=hist[hist.length-1];
    var lx=mapX(last.x), ly=mapY(last.y);
    ctx.beginPath(); ctx.arc(lx,ly,4,0,6.284); ctx.fillStyle="#fff"; ctx.fill();
    ctx.strokeStyle=sc.graph.color; ctx.lineWidth=1.6; ctx.stroke();
  }
  return rect;
}

var hudEl = document.getElementById("hud");
var hudLast = "";
/* İçeriği yazıp görünür yapar ve GERÇEK (ölçülmüş) yüksekliğini döner — grafiğe ne kadar
   pay bırakılacağını tahminle değil, tarayıcının kendi ölçtüğü değerle hesaplıyoruz. */
function setHudContent(lines){
  var html = lines.map(function(l){ return l.replace(/</g,"&lt;"); }).join("<br>");
  if (html!==hudLast){ hudEl.innerHTML=html; hudLast=html; }
  hudEl.className = "hud";
  return hudEl.getBoundingClientRect().height;
}
/* gRect verilirse (grafik paneli çizildiyse) HUD onun HEMEN ALTINA, sağ kenarı hizalı
   olacak şekilde konumlanır — böylece dar/kısa ekranlarda (ör. yatay tam ekran) iki panel
   asla üst üste binmez. gRect yoksa HUD sağ-alt köşede sabit kalır. */
function hudPanel(sw, sh, lines, gRect){
  setHudContent(lines);
  if (gRect){
    hudEl.style.top = (gRect.gy+gRect.gh+8)+"px";
    hudEl.style.right = Math.max(8, sw-(gRect.gx+gRect.gw))+"px";
    hudEl.style.bottom = "auto";
  } else {
    hudEl.style.top = "auto";
    hudEl.style.bottom = "10px";
    hudEl.style.right = "10px";
  }
}

/* ============================================================
   SAHNE ÇİZİMLERİ
   ============================================================ */
var GAUGE_UP_R = 1.75;   /* gösterge kolu+kadranın taban çizgisinin üstüne çıkan yükseklik (R birimi) */
var THERMO_DOWN_R = 1.35; /* termometrenin taban çizgisinin altına inen derinlik (R birimi) */
var TUBE_HALF_R = 1+OB_K*OB_SIN;
function layoutCylinder(sw, sh, hasGraph){
  var rightMargin = hasGraph ? sw*0.40 : sw*0.06;
  var availW = sw - sw*0.10 - rightMargin;
  var extraW = WORLD_R*OB_K*OB_COS + WORLD_R*1.2;
  var scaleW = availW/(WORLD_LMAX+extraW);

  var topPad=sh*0.04, botPad=sh*0.03;
  var availH = sh - topPad - botPad;
  var totalWorldH = GAUGE_UP_R + TUBE_HALF_R*2 + THERMO_DOWN_R;
  var scaleH = availH/(WORLD_R*totalWorldH);

  var scale = Math.min(scaleW, scaleH);
  var cx = sw*0.10 + WORLD_R*scale*0.35;
  var cy = topPad + WORLD_R*scale*(GAUGE_UP_R+TUBE_HALF_R);
  return {cx:cx, cy:cy, scale:scale};
}

function drawBox3DScene(sc){
  var d=fit(), sw=d[0], sh=d[1];
  ctx.clearRect(0,0,sw,sh);
  var lay=layoutCylinder(sw,sh, !!sc.graph || sc.mode==="slab");
  var L = currentLen(W.volFrac, W.locked);

  if (!W.inited){
    W.particles=[];
    for (var i=0;i<W.n;i++) W.particles.push(spawn3D(L, WORLD_R, speedFromT(W.T), 1, "#fbbf24", "g"));
    W.inited=true;
    var Vrel0=L/WORLD_LMAX;
    if (W.auto) W.targetP = K_P*W.n*W.T/Vrel0;
    if (sc.graph) W.gx = computeGraphDomain(sc, W);
    if (sc.combined) W.baseline = null;
  }

  step3D(W.particles, 0, L, WORLD_R, null);
  W.frame++;

  var Vrel=L/WORLD_LMAX;
  if (W.auto){
    var VrelTarget=clamp(K_P*W.n*W.T/W.targetP, VOL_MIN_FRAC, 1.05);
    W.volFrac += (VrelTarget-W.volFrac)*0.06;
    L = currentLen(W.volFrac, W.locked);
  }
  var Pmodel = K_P*W.n*W.T/Vrel;

  if (sc.combined && W.baseline===null) W.baseline = Pmodel*Vrel/W.T;

  var rightMode = W.locked ? "locked" : "piston";
  drawCylinder(lay.cx, lay.cy, lay.scale, L, WORLD_R, rightMode, true, Pmodel, 140, W.T, 900);
  var proj = mkProjector(lay.cx, lay.cy, lay.scale); proj.scale=lay.scale;
  drawParticles3D(proj, W.particles, WORLD_R);

  if (sc.mode==="slab"){
    hudEl.className="hud hide";
    return;
  }

  var hud=["T = "+Math.round(W.T)+" K","n = "+W.n,"V (bağıl) = "+Vrel.toFixed(2),"P (bağıl) = "+Pmodel.toFixed(1)];
  if (sc.showPV) hud.push("P·V ≈ "+(Pmodel*Vrel).toFixed(1));
  if (sc.combined && W.baseline!==null) hud.push("P·V/T ≈ "+(Pmodel*Vrel/W.T).toFixed(3)+"  (başlangıç: "+W.baseline.toFixed(3)+")");

  var gRect=null;
  if (sc.graph){
    if (W.frame%12===0){
      var xv = sc.graph.x==="V" ? Vrel : (sc.graph.x==="T" ? W.T : W.n);
      var yv = sc.graph.y==="P" ? Pmodel : Vrel;
      W.history.push({x:xv,y:yv});
      if (W.history.length>150) W.history.shift();
    }
    /* HUD paneli, grafiğin hemen altına yerleşecek; grafiğe önce GERÇEK (ölçülmüş)
       HUD yüksekliği kadar pay bırakarak çiziyoruz ki dar/kısa ekranlarda
       (ör. yatay tam ekran) iki panel asla çakışmasın ya da taşmasın. */
    var hudH = setHudContent(hud);
    var maxGraphH = sh - 12 - hudH - 8 - 10;
    gRect = drawGraph(W, sc, sw, sh, maxGraphH);
    hudEl.style.top = (gRect.gy+gRect.gh+8)+"px";
    hudEl.style.right = Math.max(8, sw-(gRect.gx+gRect.gw))+"px";
    hudEl.style.bottom = "auto";
  } else {
    hudPanel(sw, sh, hud, null);
  }
}

function drawDalton3DScene(sc){
  var d=fit(), sw=d[0], sh=d[1];
  ctx.clearRect(0,0,sw,sh);
  var lay=layoutCylinder(sw,sh);
  var L = currentLen(W.vol0, true);

  if (!W.inited){
    W.particles=[];
    for (var i=0;i<W.nA;i++) W.particles.push(spawn3D(L, WORLD_R, speedFromT(W.T), 1, "#fbbf24", "A"));
    for (i=0;i<W.nB;i++) W.particles.push(spawn3D(L, WORLD_R, speedFromT(W.T), 1, "#38bdf8", "B"));
    W.inited=true;
  }

  step3D(W.particles, 0, L, WORLD_R, null);
  W.frame++;

  var Vrel=W.vol0;
  var pA=K_P*W.nA*W.T/Vrel, pB=K_P*W.nB*W.T/Vrel;
  var pShown = W.filter==="A" ? pA : W.filter==="B" ? pB : pA+pB;

  drawCylinder(lay.cx, lay.cy, lay.scale, L, WORLD_R, "locked", true, pShown, 140, W.T, 900);
  var proj = mkProjector(lay.cx, lay.cy, lay.scale); proj.scale=lay.scale;
  var visible = W.filter==="both" ? W.particles : W.particles.filter(function(p){ return p.tag===W.filter; });
  drawParticles3D(proj, visible, WORLD_R);

  hudPanel(sw, sh, [
    "P (turuncu, A) = "+pA.toFixed(1),
    "P (mavi, B) = "+pB.toFixed(1),
    "P (toplam) = "+(pA+pB).toFixed(1),
    "gösterge: "+(W.filter==="A"?"yalnız A":W.filter==="B"?"yalnız B":"toplam")
  ]);
}

function drawDiffusion3DScene(sc){
  var d=fit(), sw=d[0], sh=d[1];
  ctx.clearRect(0,0,sw,sh);
  var lay=layoutCylinder(sw,sh);
  var L = currentLen(0.78, true);
  var mid = L/2;

  if (!W.inited){
    W.particles=[];
    for (var i=0;i<28;i++) W.particles.push(spawn3D(mid, WORLD_R, speedFromT(320), 1, "#fbbf24", "A"));
    for (i=0;i<28;i++){
      var p=spawn3D(mid, WORLD_R, speedFromT(320), 1, "#38bdf8", "B");
      p.x += mid; W.particles.push(p);
    }
    W.inited=true; W.barrier=true;
  }

  var walls = W.barrier ? [{x:mid, open:false, hole:0}] : null;
  step3D(W.particles, 0, L, WORLD_R, walls);
  W.frame++;

  drawCylinder(lay.cx, lay.cy, lay.scale, L, WORLD_R, "locked", false, 0, 140, 320, 900);
  var proj = mkProjector(lay.cx, lay.cy, lay.scale); proj.scale=lay.scale;
  if (W.barrier){
    var midPts = ellipsePts(proj, mid, WORLD_R, 56);
    drawCapDisc(midPts, [[0,"rgba(251,191,36,.16)"],[0.5,"rgba(251,191,36,.30)"],[1,"rgba(251,191,36,.16)"]], {stroke:"rgba(251,191,36,.9)", lw:2.2});
  }
  drawParticles3D(proj, W.particles, WORLD_R);

  var mixedRight=0, mixedLeft=0;
  W.particles.forEach(function(p){ if(p.tag==="A" && p.x>mid) mixedRight++; if(p.tag==="B" && p.x<mid) mixedLeft++; });
  hudPanel(sw, sh, [W.barrier ? "zar: kapalı" : "turuncu sağda "+mixedRight+", mavi solda "+mixedLeft]);
}

function drawEffusion3DScene(sc){
  var d=fit(), sw=d[0], sh=d[1];
  ctx.clearRect(0,0,sw,sh);

  /* İki gaz için iki yatay "şerit" (lane); her şeridin üstünde etiket+çubuk için
     sabit bir pay ayrılır, silindir kalan alana ORANTILI ölçeklenir — böylece
     dar/kısa ekranlarda (yatay tam ekran gibi) hiçbir şey kırpılmaz. */
  var Ls=WORLD_LMAX*0.62, Lr=WORLD_LMAX*0.30, Ltot=Ls+Lr;
  var laneH = sh/2;
  var topText = clamp(laneH*0.24, 15, 24);
  var botMargin = Math.max(4, laneH*0.05);
  var cylAvailH = Math.max(20, laneH-topText-botMargin);
  var barW = clamp(sw*0.22, 70, 160);
  var availW = Math.max(60, sw - sw*0.06 - barW - 14);
  var scaleW = availW/(Ltot+WORLD_R*2.4);
  var scaleH = cylAvailH/(TUBE_HALF_R*WORLD_R*2.6);
  var pairScale = Math.min(scaleW, scaleH);
  var cx = sw*0.03 + WORLD_R*pairScale*0.35;
  var cy1 = topText + cylAvailH/2;
  var cy2 = laneH + topText + cylAvailH/2;

  if (!W.inited){
    W.pl=[]; W.ph=[];
    for (var i=0;i<20;i++) W.pl.push(spawn3D(Ls, WORLD_R, speedFromT(560), 1, "#38bdf8", "L", 0.045));
    for (i=0;i<20;i++) W.ph.push(spawn3D(Ls, WORLD_R, speedFromT(140), 4, "#fb7185", "H", 0.06));
    W.inited=true;
  }

  var wallsPair=[{x:Ls, open:false, hole:0.16}];
  step3D(W.pl, 0, Ltot, WORLD_R, wallsPair);
  step3D(W.ph, 0, Ltot, WORLD_R, wallsPair);
  W.frame++;

  function drawPair(cx,cy,list,PMax){
    drawCylinder(cx, cy, pairScale, Ltot, WORLD_R, "locked", false, 0, PMax, 300, 900);
    var proj = mkProjector(cx, cy, pairScale); proj.scale=pairScale;
    var wallPts = ellipsePts(proj, Ls, WORLD_R, 48);
    drawCapDisc(wallPts, [[0,"rgba(30,41,59,.85)"],[1,"rgba(15,20,30,.85)"]], {stroke:"rgba(100,116,139,.6)"});
    ctx.save();
    ctx.beginPath(); ctx.arc(proj(Ls,0,0)[0], proj(Ls,0,0)[1], 0.16*pairScale, 0, Math.PI*2);
    ctx.fillStyle="#05070c"; ctx.fill();
    ctx.strokeStyle="#fbbf24"; ctx.lineWidth=1.6; ctx.stroke();
    ctx.restore();
    drawParticles3D(proj, list, WORLD_R);
  }
  drawPair(cx, cy1, W.pl, 90);
  drawPair(cx, cy2, W.ph, 90);

  var recvL=0, recvH=0;
  W.pl.forEach(function(p){ if (p.x>Ls) recvL++; });
  W.ph.forEach(function(p){ if (p.x>Ls) recvH++; });

  var fontPx = clamp(topText*0.5, 10.5, 13);
  ctx.font="600 "+fontPx+"px ui-monospace, monospace"; ctx.textAlign="left";
  var labelY1 = topText*0.62, labelY2 = laneH+topText*0.62;
  ctx.fillStyle="#38bdf8"; ctx.fillText("hafif gaz (H₂) — karşı odada: "+recvL+" / "+W.pl.length, sw*0.03, labelY1);
  ctx.fillStyle="#fb7185"; ctx.fillText("ağır gaz (O₂) — karşı odada: "+recvH+" / "+W.ph.length, sw*0.03, labelY2);

  var barH = clamp(topText*0.4, 7, 12);
  var bx = sw-barW-8;
  ctx.fillStyle="#1f2937"; ctx.fillRect(bx, labelY1-barH*0.85, barW, barH);
  ctx.fillStyle="#38bdf8"; ctx.fillRect(bx, labelY1-barH*0.85, barW*(recvL/Math.max(W.pl.length,1)), barH);
  ctx.fillStyle="#1f2937"; ctx.fillRect(bx, labelY2-barH*0.85, barW, barH);
  ctx.fillStyle="#fb7185"; ctx.fillRect(bx, labelY2-barH*0.85, barW*(recvH/Math.max(W.ph.length,1)), barH);
}

/* ============================================================
   ANA DÖNGÜ
   ============================================================ */
function fit(){
  var r=cv.getBoundingClientRect();
  var dpr=window.devicePixelRatio||1;
  if (cv.width!==Math.round(r.width*dpr)){ cv.width=Math.round(r.width*dpr); cv.height=Math.round(r.height*dpr); }
  ctx.setTransform(dpr,0,0,dpr,0,0);
  return [r.width, r.height];
}

function loop(){
  var sc=SCENES[idx];
  var mode = sc.mode==="slab" ? "box3d" : sc.mode;
  if (mode==="box3d" && W) drawBox3DScene(sc);
  else if (mode==="dalton3d" && W) drawDalton3DScene(sc);
  else if (mode==="diffusion3d" && W) drawDiffusion3DScene(sc);
  else if (mode==="effusion3d" && W) drawEffusion3DScene(sc);
  requestAnimationFrame(loop);
}

/* ============================================================
   ARAYÜZ
   ============================================================ */
var idx=0;
var cv=document.getElementById("cv"), ctx=cv.getContext("2d");
var slab=document.getElementById("slab");

var SLIDER_META = {
  T:{min:200,max:650,step:10,label:"Sıcaklık (K)"},
  V:{min:16,max:100,step:1,label:"Hacim (%)"},
  n:{min:10,max:70,step:2,label:"Tanecik sayısı"}
};

function buildChapters(){
  var nav=document.getElementById("chapters");
  nav.innerHTML="";
  CHAPTERS.forEach(function(ch){
    var b=document.createElement("button");
    b.className="chip"; b.textContent=ch.label;
    b.onclick=function(){ idx=ch.from; render(); };
    nav.appendChild(b);
  });
}
function syncChapters(){
  var nav=document.getElementById("chapters");
  var activeI=0;
  for (var i=0;i<CHAPTERS.length;i++) if (idx>=CHAPTERS[i].from) activeI=i;
  Array.prototype.forEach.call(nav.children, function(c,i){ c.className = i===activeI ? "chip on" : "chip"; });
}

function render(){
  var sc=SCENES[idx];
  document.getElementById("step").textContent=sc.step;
  document.getElementById("title").textContent=sc.title;
  document.getElementById("say").textContent=sc.say;
  document.getElementById("say").className = sc.say ? "say" : "say hide";
  document.getElementById("note").innerHTML=sc.note;
  document.getElementById("count").textContent=(idx+1)+" / "+SCENES.length;
  document.getElementById("prev").disabled = idx===0;
  document.getElementById("next").disabled = idx===SCENES.length-1;
  syncChapters();

  hudEl.className="hud hide"; hudLast="";

  var isSlab = sc.mode==="slab";
  slab.className = isSlab ? "slab" : "slab hide";
  if (isSlab){
    slab.innerHTML = sc.slab==="ideal" ? IDEAL_HTML
      : sc.slab==="real" ? REAL_HTML
      : END_HTML;
  }

  initScene();

  var ex=document.getElementById("extra"); ex.innerHTML="";

  if (sc.mode==="box3d" && sc.sliders && sc.sliders.length){
    sc.sliders.forEach(function(key){
      var meta = SLIDER_META[key];
      var min=meta.min, max = key==="n" ? (sc.nMax||meta.max) : meta.max;
      var minN = key==="n" ? (sc.nMin||meta.min) : meta.min;
      var startVal = key==="T" ? (sc.T0||300) : key==="n" ? (sc.n0||40) : Math.round((sc.vol0||0.5)*100);
      var wrap=document.createElement("span"); wrap.className="ctrl";
      var lab=document.createElement("span"); lab.textContent=meta.label;
      var inp=document.createElement("input"); inp.type="range";
      inp.min=key==="n"?minN:min; inp.max=max; inp.step=meta.step; inp.value=startVal;
      var val=document.createElement("span"); val.className="val"; val.textContent=startVal;
      inp.oninput=function(){
        val.textContent=this.value;
        if (!W) return;
        if (key==="T") setTemperature(W, Number(this.value));
        else if (key==="V") W.volFrac=Number(this.value)/100;
        else if (key==="n") setParticleCount(W, Number(this.value), currentLen(W.volFrac, W.locked), WORLD_R, "#fbbf24");
      };
      wrap.appendChild(lab); wrap.appendChild(inp); wrap.appendChild(val);
      ex.appendChild(wrap);
    });
  }

  if (sc.mode==="dalton3d" && sc.speciesToggle){
    [["both","ikisi birden"],["A","sadece turuncu"],["B","sadece mavi"]].forEach(function(k){
      var b=document.createElement("button");
      b.textContent=k[1]; b.className = W.filter===k[0] ? "on" : "";
      b.onclick=function(){
        W.filter=k[0];
        Array.prototype.slice.call(ex.children).forEach(function(c){ c.className=""; });
        b.className="on";
      };
      ex.appendChild(b);
    });
  }

  if (sc.mode==="diffusion3d"){
    var tb=document.createElement("button");
    tb.textContent = W.barrier ? "bölmeyi kaldır" : "bölmeyi yerleştir";
    tb.onclick=function(){
      W.barrier=!W.barrier;
      tb.textContent = W.barrier ? "bölmeyi kaldır" : "bölmeyi yerleştir";
      tb.className = W.barrier ? "" : "on";
    };
    ex.appendChild(tb);
    var rb2=document.createElement("button");
    rb2.textContent="sıfırla";
    rb2.onclick=function(){ initScene(); render(); };
    ex.appendChild(rb2);
  }

  if (sc.mode==="effusion3d" && sc.resettable){
    var rb=document.createElement("button");
    rb.textContent="sıfırla";
    rb.onclick=function(){ initScene(); };
    ex.appendChild(rb);
  }
}

function go(n){
  idx=Math.max(0, Math.min(SCENES.length-1, idx+n));
  render();
}
document.getElementById("next").onclick=function(){go(1)};
document.getElementById("prev").onclick=function(){go(-1)};
document.getElementById("fs").onclick=function(){
  if (document.fullscreenElement) document.exitFullscreen();
  else document.documentElement.requestFullscreen();
};
document.addEventListener("keydown",function(e){
  if (e.target && (e.target.type==="range")) return;
  if (e.key==="ArrowRight"||e.key===" "||e.key==="PageDown"){ e.preventDefault(); go(1); }
  if (e.key==="ArrowLeft"||e.key==="PageUp"){ e.preventDefault(); go(-1); }
});

buildChapters();
render();
requestAnimationFrame(loop);

if ("serviceWorker" in navigator){
  window.addEventListener("load", function(){
    navigator.serviceWorker.register("sw.js").catch(function(){});
  });
}
</script>
</body>
</html>
